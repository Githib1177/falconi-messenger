<!doctype html><html lang="cs"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Falconi – diagnostika příjmu SMS</title>
<style>body{font:17px system-ui;max-width:650px;margin:40px auto;padding:20px;color:#16385c}p{line-height:1.6}button{font:inherit;padding:15px;cursor:pointer}</style>
<h1>Ověření odpovědi schránek přes API</h1>
<p>Jednorázový dotaz na seznam majitelů. Příjemce: +420602783619. Systémový odesílatel. Příkaz pouze čte seznam; neotevírá schránky a nemění kódy.</p>
<button id="query">Odeslat schválený dotaz přes API</button><p id="result" role="status"></p><a href="/">Zpět do Messengeru</a>
<script>
const button=document.querySelector('#query'),result=document.querySelector('#result');
button.onclick=async()=>{
 if(button.disabled)return;
 button.disabled=true;result.textContent='Odesílám dotaz…';
 try{
  const response=await fetch('/api/send-sms',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({to:['+420602783619'],text:'**pin0000*01*ln*',historyId:'selax-owner-api-20260919-comparison-01',guest:'Diagnostika – seznam majitelů'})});
  const data=await response.json();
  if(!response.ok||!data.ok)throw new Error(data.error||'Odeslání nebylo potvrzeno.');
  result.textContent='Dotaz přijat bránou. ID SMS: '+data.results.map(r=>r.sms_id).join(', ')+'. Odpověď zkontrolujte v Messengeru.';
 }catch(error){result.textContent=error.message+' Dotaz neopakujte, nejprve ověřte historii SMSbrány.';}
};
</script></html>
