<div id="falconi-guest" lang="en">
<p>Pension Falconi · Sokolská 6, Kolín</p>
<p>Check-in from 14:00 · Check-out by 10:00</p>
<p>Reception is available by phone 24 hours a day. <a href="tel:+420721516894">+420 721 516 894</a></p>
<noscript><p>Enable JavaScript to view your personal instructions, or contact reception.</p></noscript></div>
<script>(function(){
/* Shared by the proposal and compatibility tests. No network requests. */
function parseFalconiLink(input) {
  const url = new URL(input, 'https://www.pensionfalconi.cz');
  const parts = url.pathname.split('/').filter(Boolean);
  const lang = ['cs', 'en', 'de'].includes(parts[0]) ? parts[0] : 'cs';
  const page = parts[1] === 'codes' ? 'codes' : 'checkin';
  const p = url.searchParams;
  const box = (p.get('box') || (page === 'codes' ? p.get('schranka') : '') || '').trim();
  const done = p.get('done') === '1', unpaid = p.get('unpaid') === '1';
  const alf = p.get('alf') || '';
  let alfUrl = '', alfCode = '';
  if (alf) {
    if (/^https?:\/\//i.test(alf)) {
      alfUrl = alf;
      const match = alf.match(/\/login\/([^/?#]+)/i);
      if (match) { try { alfCode = decodeURIComponent(match[1]); } catch { alfCode = match[1]; } }
    } else {
      alfCode = alf;
      alfUrl = 'https://alfred.previo.app/login/' + encodeURIComponent(alf);
    }
  }
  // A code does not itself prove check-in or payment. Legacy links can contain
  // a box code without either status flag; keep their code available.
  const state = !done ? (unpaid ? 'both' : 'todo') : unpaid ? 'unpaid' : box ? 'ready' : 'kiosk';
  return { lang, page, state, box, done, unpaid, alfUrl, alfCode,
    boxNote: p.get('boxnote') || '', checkout: p.get('checkout') || '' };
}

const config={"lang":"en","page":"checkin","t":{"eye":"Your stay at Pension Falconi","title":"Arrive with peace of mind.","sub":"Everything you need for a smooth arrival, in one place.","codeTitle":"Your room key card","codeSub":"Your code and a short guide to collecting your card.","checkin":"Check-in from","checkout":"Check-out by","helpLabel":"Phone assistance","todo":["Before you arrive","Complete online check-in","Enter the details of all guests with Alfred, our virtual receptionist, and check your payment status.","Open online check-in"],"both":["Before you arrive","Complete check-in and payment","Enter the details of all guests with Alfred, our virtual receptionist, and pay the outstanding balance.","Complete check-in and payment"],"unpaid":["One step left","Complete your payment","Online check-in is complete. Open Alfred and pay the outstanding balance.","Open Alfred and pay"],"ready":["All set","We look forward to seeing you from 14:00","Check-in and payment are complete. Reception has prepared your key card in a box outside the pension entrance. Collect it using the code shown here.","View your booking in Alfred"],"kiosk":["Check-in and payment complete","Arrival from 14:00","Ring the bell at the main entrance to contact reception for access. The kiosk is inside, beyond the main entrance. It guides you through check-in and any outstanding payment, then issues your key cards. If check-in and payment are already complete and no card is waiting in a key box, the kiosk simply issues your card after verification.","Open Alfred"],"missing":["No code included","There is no key box code in this link","If you were expecting a code to collect your key card, please contact reception.","Contact reception"],"access":"How to check in","boxLabel":"Key box code","demo":"Example code — not valid for a real key box","boxSteps":["The key boxes are outside, in front of the pension entrance.","Enter the six-digit code shown here and collect your card.","The card opens your roo cess. The kiosk is inside, beyond the main entrance. You can complete check-in and pay for your booking there. Once you have finished, the kiosk issues your key cards. If check-in and payment are already complete and no card is waiting in a key box, the kiosk simply issues your card after verification.","help":"Ring the bell at the main entrance to contact reception for access. The kiosk is inside, beyond the main entrance. It guides you through check-in and any outstanding payment, then issues your key cards. If check-in and payment are already complete and no card is waiting in a key box, the kiosk simply issues your card after verification.","ready":"Check-in and payment are complete. Reception has prepared your key card in a box outside the pension entrance. Collect it using the code shown here.","first":"The key boxes are outside, in front of the pension entrance."},"photos":{"box":"Key boxes outside the pension entrance. The reception doorbell is on the right, next to the boxes.","kiosk":"The kiosk inside, beyond the main entrance — check-in, payment and key card collection."},"codeStatus":["Key box access","Collect your room key card","The key boxes are outside, in front of the pension entrance. Use the code shown here and follow the steps below.",""]};

est details p{font-size:14px}#falconi-guest figure{margin:18px 0 8px}#falconi-guest figure img{display:block;width:100%;height:auto;max-height:420px;object-fit:contain;background:#f0efec;border-radius:10px}#falconi-guest figcaption{font-size:13px;color:var(--muted);margin-top:8px}#falconi-guest .help{display:flex;gap:16px;justify-content:space-between;align-items:center;background:#e9edf0;border-radius:14px;padding:23px}#falconi-guest .help p{margin:0;font-size:14px}#falconi-guest .footer{text-align:center;font-size:12px;color:var(--muted);margin-top:22px}\n@media(max-width:640px){#falconi-guest{padding:18px 12px 26px;font-size:16px}#falconi-guest .grid{display:block}#falconi-guest .brand img{width:125px}#falconi-guest .brand span{font-size:10px}#falconi-guest .facts div{padding:0 9px}#falconi-guest .facts strong{font-size:18px}#falconi-guest .status,#falconi-guest .card{padding:18px}#falconi-guest .help{display:block;padding:18px}#falconi-guest .help .button{margin-top:15px}#falconi-guest .intro{padding-top:18px}}\n";
const root=document.getElementById('falconi-guest');
if(!root)return;
const style=document.createElement('style');style.textContent=scopedCss;root.appendChild(style);
const content=document.createElement('div');root.appendChild(content);
const {lang,page,t,a,photos}=config;
const state=parseFalconiLink('https://www.pensionfalconi.cz/'+lang+'/'+page+'/'+location.search);
const esc=value=>String(value||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const phone='tel:+420721516894';
const maps='https://maps.google.com/?q=Sokolsk%C3%A1+6,+Kol%C3%ADn';
const parking='https://maps.google.com/?q=25HX%2BMF%20Kol%C3%ADn%2C%20Kol%C3%ADn%202';
let alfUrl='';
try{const u=new URL(state.alfUrl);if(['https:','http:'].includes(u.protocol)&&['alfred.previo.app','alfred.previo.cz'].includes(u.hostname)&&!u.username&&!u.password)alfUrl=u.href;}catch{}
const link=(label,href,secondary=false)=>`<a class="button${secondary?' secondary':''}" href="${esc(href)}"${/^https?:/.test(href)?' target="_blank" rel="noopener noreferrer"':''}>${esc(label)}</a>`;
const copyText={cs:['Kopírovat kód','Zkopírováno','Kód opište z obrazovky.'],en:['Copy code','Copied','Please read the code from the screen.'],de:['Code kopieren','Kopiert','Bitte lesen Sie den Code vom Bildschirm ab.']}[lang];
const code=(label,value,copy=false)=>`<div class="code"><div class="code-label">${esc(label)}</div><strong class="digits">${esc(value)}</strong>${copy?`<button type="button" class="copy">${copyText[0]}</button><div class="copy-status" role="status" aria-live="polite"></div>`:''}</div>`;
const photo=kind=>`<figure><img src="https://files.previo.app/85/www/img/photos/${kind==='box'?'20250908135254_wRQrGw.jpg':'20250908135254_MjaYii.jpg'}" width="750" height="1000" loading="lazy" decoding="async" alt="${esc(photos[kind])}"><figcaption>${esc(photos[kind])}</figcaption></figure>`;
const codes=page==='codes',hasBox=!!state.box;
const status=codes?(hasBox?config.codeStatus:t.missing):t[state.state];
const missingAlf={cs:'Alfrédův kód v tomto odkazu chybí. Použijte úplný odkaz z potvrzení rezervace nebo kontaktujte recepci.',en:'This link does not include your Alfred code. Use the full link from your booking confirmation or contact reception.',de:'Dieser Link enthält keinen Alfréd-Code. Verwenden Sie den vollständigen Link aus Ihrer Buchungsbestätigung oder kontaktieren Sie die Rezeption.'}[lang];
const kioskBlock=`<section class="detail alf-access"><h3>${esc(a.kioskTitle)}</h3>${photo('kiosk')}${alfUrl&&state.alfCode?code(t.alfLabel,state.alfCode):`<div class="code"><div class="code-label">${esc(t.alfLabel)}</div><p>${esc(missingAlf)}</p></div>`}<p>${esc(t.kioskHelp)}</p>${alfUrl?link(t.ready[3],alfUrl,true):link(t.call,phone,true)}</section>`;
const access=(hasBox?`${photo('box')}<ol class="steps">${t.boxSteps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>`:codes?`<p>${esc(t.missing[2])}</p>${photo('box')}`:state.state==='kiosk'?'':`<h3>${esc(a.onlineTitle)}</h3><p>${esc(a.online)}</p>${photo('box')}`)+kioskBlock;
// Legacy checkout formatting: preserve emphasis and line breaks, never arbitrary HTML.
const checkout=codes&&state.checkout?esc(state.checkout).replace(/&lt;(\/?(?:b|strong))&gt;/gi,'<$1>').replace(/&lt;br\s*\/?&gt;/gi,'<br>'):esc(t.leavingText);
content.innerHTML=`<header class="brand"><img src="https://files.previo.cz/85/www/logo.png" width="230" height="100" alt="Pension Falconi"><span>KOLÍN · SOKOLSKÁ 6</span></header><section class="intro"><p class="eyebrow">${esc(t.eye)}</p><h1>${esc(codes?t.codeTitle:t.title)}</h1><p class="muted">${esc(codes?t.codeSub:t.sub)}</p></section><section class="status ${(codes?hasBox:state.done&&!state.unpaid)?'ready':''}"><div class="tag">${esc(status[0])}</div><h2>${esc(status[1])}</h2><p>${esc(status[2])}</p>${hasBox?code(t.boxLabel,state.box,true)+(state.boxNote?`<p>${esc(state.boxNote)}</p>`:''):(codes?link(t.call,phone):alfUrl?link(status[3],alfUrl):`<p class="missing-alf">${esc(missingAlf)}</p>`)}</section><div class="facts"><div><small>${esc(t.checkin)}</small><strong>14:00</strong></div><div><small>${esc(t.checkout)}</small><strong>10:00</strong></div><div><small>${esc(t.helpLabel)}</small><strong>24/7</strong></div></div><div class="grid"><div><section class="card"><h2>${esc(t.access)}</h2>${access}</section>${!codes?`<section class="card"><h2>${esc(t.stay)}</h2><h3>${esc(t.breakfast)}</h3><p><b>${esc(t.week)}</b></p><p>${esc(t.breakfastText)}</p><details><summary>${esc(t.extras)}</summary><p>${esc(t.extrasText)}</p>${alfUrl?link(t.ready[3],alfUrl,true):''}</details></section>`:''}</div><div><section class="card"><h2>${esc(t.arrival)}</h2><p>${esc(t.address)}</p>${link(t.navigate,maps)}<div class="detail"><h3>${esc(t.parking)}</h3><p>${esc(t.parkText)}</p><p><b>${esc(t.parkHours)}</b></p>${link(t.parkLink,parking,true)}</div></section><section class="card"><h2>${esc(t.leaving)}</h2><p>${checkout}</p></section></div></div><aside class="help"><div><h2>${esc(t.help)}</h2><p>${esc(t.helpText)}</p><p><a href="${phone}">+420 721 516 894</a> · <a href="mailto:recepce@falconi.cz">recepce@falconi.cz</a></p></div>${link(t.call,phone)}</aside><footer class="footer">${esc(t.footer)}</footer>`;
// Remove fallback only after successful rendering.
Array.from(root.children).forEach(el=>{if(el!==style&&el!==content)el.remove();});
const copyButton=root.querySelector('.copy');
if(copyButton)copyButton.addEventListener('click',async()=>{const notice=root.querySelector('.copy-status');try{await navigator.clipboard.writeText(state.box);notice.textContent=copyText[1];}catch{notice.textContent=copyText[2];}});

})();</script>
