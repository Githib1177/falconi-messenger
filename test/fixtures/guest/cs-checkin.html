function parseFalconiLink(input) {
  const url = new URL(input, 'https://www.pensionfalconi.cz');
  const parts = url.pathname.split('/').filter(Boolean);
  const lang = ['cs', 'en', 'de'].includes(parts[0]) ? parts[0] : 'cs';
  const page = parts[1] === 'codes' ? 'codes' : 'checkin';
  const p = url.searchParams;
  const box = (p.get('box') || (page === 'codes' ? p.get('schranka') : '') || '').trim();
  const done = p.get('done') === '1', unpaid = p.get('unpaid') === '1';
  const alf = p.get('alf') || '';
  let alfUrl = '', alfCode = '';
  if (alf) {
    if (/^https?:\/\//i.test(alf)) {
      alfUrl = alf;
      const match = alf.match(/\/login\/([^/?#]+)/i);
      if (match) { try { alfCode = decodeURIComponent(match[1]); } catch { alfCode = match[1]; } }
    } else {
      alfCode = alf;
      alfUrl = 'https://alfred.previo.app/login/' + encodeURIComponent(alf);
    }
  }
  // A code does not itself prove check-in or payment. Legacy links can contain
  // a box code without either status flag; keep their code available.
  const state = !done ? (unpaid ? 'both' : 'todo') : unpaid ? 'unpaid' : box ? 'ready' : 'kiosk';
  return { lang, page, state, box, done, unpaid, alfUrl, alfCode,
    boxNote: p.get('boxnote') || '', checkout: p.get('checkout') || '' };
}

const root=document.getElementById('falconi-guest');
if(!root)return;
const style=document.createElement('style');style.textContent=scopedCss;root.appendChild(style);
const content=document.createElement('div');root.appendChild(content);
const {lang,page,t,a,photos}=config;
const state=parseFalconiLink('https://www.pensionfalconi.cz/'+lang+'/'+page+'/'+location.search);
