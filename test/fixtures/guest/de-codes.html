/* Shared by the proposal and compatibility tests. No network requests. */
function parseFalconiLink(input) {
  const url = new URL(input, 'https://www.pensionfalconi.cz');
  const parts = url.pathname.split('/').filter(Boolean);
  const lang = ['cs', 'en', 'de'].includes(parts[0]) ? parts[0] : 'cs';
  const page = parts[1] === 'codes' ? 'codes' : 'checkin';
  const p = url.searchParams;
  const box = (p.get('box') || (page === 'codes' ? p.get('schranka') : '') || '').trim();
  const done = p.get('done') === '1', unpaid = p.get('unpaid') === '1';
  const alf = p.get('alf') || '';
  let alfUrl = '', alfCode = '';
  if (alf) {
    if (/^https?:\/\//i.test(alf)) {
      alfUrl = alf;
      const match = alf.match(/\/login\/([^/?#]+)/i);
      if (match) { try { alfCode = decodeURIComponent(match[1]); } catch { alfCode = match[1]; } }
    } else {
      alfCode = alf;
      alfUrl = 'https://alfred.previo.app/login/' + encodeURIComponent(alf);
    }
  }
  // A code does not itself prove check-in or payment. Legacy links can contain
  // a box code without either status flag; keep their code available.
  const state = !done ? (unpaid ? 'both' : 'todo') : unpaid ? 'unpaid' : box ? 'ready' : 'kiosk';
  return { lang, page, state, box, done, unpaid, alfUrl, alfCode,
    boxNote: p.get('boxnote') || '', checkout: p.get('checkout') || '' };
}

const root=document.getElementById('falconi-guest');
if(!root)return;
const style=document.createElement('style');style.textContent=scopedCss;root.appendChild(style);
const content=document.createElement('div');root.appendChild(content);
const {lang,page,t,a,photos}=config;
const state=parseFalconiLink('https://www.pensionfalconi.cz/'+lang+'/'+page+'/'+location.search);

const maps='https://maps.google.com/?q=Sokolsk%C3%A1+6,+Kol%C3%ADn';

content.innerHTML=`<header class="brand"><img src="https://files.previo.cz/85/www/logo.png" width="230" height="100" alt="Pension Falconi"><span>KOLÍN · SOKOLSKÁ 6</span></header><section class="intro"><p class="eyebrow">${esc(t.eye)}</p><h1>${esc(codes?t.codeTitle:t.title)}</h1><p class="muted">${esc(codes?t.codeSub:t.sub)}</p></section><section class="status ${(codes?hasBox:state.done&&!state.unpaid)?'ready':''}"><div class="tag">${esc(status[0])}</div><h2>${esc(status[1])}</h2><p>${esc(status[2])}</p>${hasBox?code(t.boxLabel,state.box,true)+(state.boxNote?`<p>${esc(state.boxNote)}</p>`:''):(codes?link(t.call,phone):alfUrl?link(status[3],alfUrl):`<p class="missing-alf">${esc(missingAlf)}</p>`)}</section><div class="facts"><div><small>${esc(t.checkin)}</small><strong>14:00</strong></div><div><small>${esc(t.checkout)}</small><strong>10:00</strong></div><div><small>${esc(t.helpLabel)}</small><strong>24/7</strong></div></div><div class="grid"><div><section class="card"><h2>${esc(t.access)}</h2>${access}</section>${!codes?`<section class="card"><h2>${esc(t.stay)}</h2><h3>${esc(t.breakfast)}</h3><p><b>${esc(t.week)}</b></p><p>${esc(t.breakfastText)}</p><details><summary>${esc(t.extras)}</summary><p>${esc(t.extrasText)}</p>${alfUrl?link(t.ready[3],alfUrl,true):''}</details></section>`:''}</div><div><section class="card"><h2>${esc(t.arrival)}</h2><p>${esc(t.address)}</p>${link(t.navigate,maps)}<div class="detail"><h3>${esc(t.parking)}</h3><p>${esc(t.parkText)}</p><p><b>${esc(t.parkHours)}</b></p>${link(t.parkLink,parking,true)}</div></section><section class="card"><h2>${esc(t.leaving)}</h2><p>${checkout}</p></section></div></div><aside class="help"><div><h2>${esc(t.help)}</h2><p>${esc(t.helpText)}</p><p><a href="${phone}">+420 721 516 894</a> · <a href="mailto:recepce@falconi.cz">recepce@falconi.cz</a></p></div>${link(t.call,phone)}</aside><footer class="footer">${esc(t.footer)}</footer>`;
